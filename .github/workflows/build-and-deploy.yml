name: Build and deploy main

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Build root project
        run: pnpm run build

      - name: Run tests
        run: pnpm test

      - name: Build website
        run: pnpm run build:website

      - name: Build examples
        run: pnpm run build:examples

      - name: Build typedoc API reference
        run: pnpm run typedoc

      - name: Assemble Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -r website/dist/. _site/
          mkdir -p _site/examples && cp -r examples/dist/. _site/examples/
          mkdir -p _site/docs && cp -r dist-typedoc/. _site/docs/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
